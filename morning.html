<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0A1628;
      color: #F0F4FF;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 48px 64px;
    }

    /* ── Layout ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Cards ── */
    .card {
      background: #112240;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 32px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #378ADD;
      margin-bottom: 20px;
    }

    /* ── Clock ── */
    .clock-card {
      grid-column: 1;
      grid-row: 1;
    }

    #time {
      font-size: 64px;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #FFFFFF;
    }

    #date {
      font-size: 18px;
      font-weight: 400;
      color: #F0F4FF;
      margin-top: 10px;
      opacity: 0.7;
    }

    /* ── Priorities ── */
    .priorities-card {
      grid-column: 2;
      grid-row: 1 / 3;
    }

    .priority-item {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .priority-item:last-of-type {
      margin-bottom: 0;
    }

    .priority-num {
      font-size: 12px;
      font-weight: 500;
      color: #378ADD;
      width: 20px;
      flex-shrink: 0;
    }

    .priority-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: #F0F4FF;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 8px 0;
      outline: none;
      transition: border-color 0.15s;
    }

    .priority-input:focus {
      border-bottom-color: #F5C842;
    }

    .priority-input::placeholder {
      color: rgba(240, 244, 255, 0.25);
      font-size: 14px;
    }

    .clear-btn {
      margin-top: 28px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(240, 244, 255, 0.5);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      padding: 8px 16px;
      cursor: pointer;
      letter-spacing: 0.03em;
    }

    .clear-btn:hover {
      opacity: 0.7;
    }

    /* ── Quote ── */
    .quote-card {
      grid-column: 1;
      grid-row: 2;
      border-left: 2px solid #378ADD;
      background: transparent;
      border-top: none;
      border-right: none;
      border-bottom: none;
      padding: 0 0 0 20px;
      display: flex;
      align-items: center;
    }

    .quote-card p {
      font-size: 13px;
      font-weight: 400;
      color: rgba(240, 244, 255, 0.45);
      line-height: 1.6;
      font-style: italic;
    }

    /* ── Launch buttons ── */
    .launch-card {
      grid-column: 1 / 3;
      grid-row: 3;
    }

    .launch-grid {
      display: flex;
      gap: 16px;
    }

    .launch-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(55, 138, 221, 0.08);
      border: 1px solid rgba(55, 138, 221, 0.2);
      color: #F0F4FF;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      padding: 12px 20px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .launch-btn:hover {
      opacity: 0.75;
    }

    .launch-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    @media (max-width: 900px) {
      body {
        padding: 32px 24px;
      }

      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }

      .priorities-card {
        grid-column: 1;
        grid-row: auto;
      }

      .quote-card {
        grid-column: 1;
        grid-row: auto;
      }

      .launch-card {
        grid-column: 1;
        grid-row: auto;
      }

      #time {
        font-size: 48px;
      }

      .launch-grid {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="grid">

    <!-- Clock -->
    <div class="card clock-card">
      <div class="card-label">Today</div>
      <div id="time">--:--</div>
      <div id="date">Loading...</div>
    </div>

    <!-- Priorities -->
    <div class="card priorities-card">
      <div class="card-label">Top 3 priorities</div>
      <div class="priority-item">
        <span class="priority-num">1</span>
        <input class="priority-input" id="p1" type="text" placeholder="Priority 1" autocomplete="off" spellcheck="false" />
      </div>
      <div class="priority-item">
        <span class="priority-num">2</span>
        <input class="priority-input" id="p2" type="text" placeholder="Priority 2" autocomplete="off" spellcheck="false" />
      </div>
      <div class="priority-item">
        <span class="priority-num">3</span>
        <input class="priority-input" id="p3" type="text" placeholder="Priority 3" autocomplete="off" spellcheck="false" />
      </div>
      <button class="clear-btn" id="clearBtn">Clear day</button>
    </div>

    <!-- Quote -->
    <div class="quote-card">
      <p>Vision without execution is hallucination.</p>
    </div>

    <!-- Launch -->
    <div class="card launch-card">
      <div class="card-label">Quick launch</div>
      <div class="launch-grid">
        <a class="launch-btn" href="https://outlook.office.com" target="_blank" rel="noopener">
          <!-- Outlook envelope icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M2 8l10 6 10-6"/>
          </svg>
          Outlook
        </a>
        <a class="launch-btn" href="https://teams.microsoft.com" target="_blank" rel="noopener">
          <!-- Teams message icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 8h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2v4l-4-4H9a2 2 0 0 1-2-2v-1"/>
            <path d="M15 2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2v4l4-4h4a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
          </svg>
          Teams
        </a>
        <a class="launch-btn" href="https://www.office.com/launch/excel" target="_blank" rel="noopener">
          <!-- Excel grid icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M3 15h18M9 3v18"/>
          </svg>
          Excel
        </a>
      </div>
    </div>

  </div>

  <script>
    // ── Clock ──────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const mins = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${mins}`;

      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const dayName = days[now.getDay()];
      const monthName = months[now.getMonth()];
      const dayNum = now.getDate();
      document.getElementById('date').textContent = `${dayName}, ${monthName} ${dayNum}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // ── Priorities — localStorage ──────────────────────────
    const fields = ['p1', 'p2', 'p3'];

    fields.forEach(id => {
      const el = document.getElementById(id);
      const saved = localStorage.getItem(id);
      if (saved) el.value = saved;

      el.addEventListener('input', () => {
        localStorage.setItem(id, el.value);
      });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      fields.forEach(id => {
        document.getElementById(id).value = '';
        localStorage.removeItem(id);
      });
    });
  </script>
</body>
</html>
