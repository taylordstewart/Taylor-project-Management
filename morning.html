<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #FFFFFF;
      color: #0A1628;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 0 0 48px;
    }

    /* ── Top bar with launch buttons ── */
    .topbar {
      background: #0A1628;
      padding: 14px 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }

    .topbar-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-right: 8px;
    }

    .launch-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(55, 138, 221, 0.12);
      border: 1px solid rgba(55, 138, 221, 0.3);
      color: #F0F4FF;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      padding: 8px 16px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .launch-btn:hover {
      opacity: 0.75;
    }

    .launch-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ── Main layout ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 64px;
    }

    /* ── Cards ── */
    .card {
      background: #F4F7FB;
      border: 1px solid #D6E4F5;
      padding: 32px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #378ADD;
      margin-bottom: 20px;
    }

    /* ── Clock ── */
    .clock-card {
      grid-column: 1;
      grid-row: 1;
    }

    #time {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #0A1628;
    }

    #date {
      font-size: 18px;
      font-weight: 400;
      color: #378ADD;
      margin-top: 10px;
    }

    /* ── Quote ── */
    .quote-card {
      grid-column: 2;
      grid-row: 1;
      background: #0A1628;
      border: none;
      display: flex;
      align-items: center;
      padding: 40px;
    }

    .quote-card p {
      font-size: 22px;
      font-weight: 300;
      color: #FFFFFF;
      line-height: 1.5;
      font-style: italic;
      letter-spacing: -0.01em;
    }

    .quote-card p em {
      font-style: normal;
      color: #378ADD;
    }

    /* ── Priorities ── */
    .priorities-card {
      grid-column: 1 / 3;
      grid-row: 2;
    }

    .priorities-inner {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
    }

    .priority-slot {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .priority-slot-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #378ADD;
    }

    .priority-input {
      width: 100%;
      background: #FFFFFF;
      border: 1.5px solid #D6E4F5;
      color: #0A1628;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 12px 14px;
      outline: none;
    }

    .priority-input:focus {
      border-color: #378ADD;
      background: #F4F7FB;
    }

    .priority-input::placeholder {
      color: rgba(10, 22, 40, 0.25);
      font-size: 14px;
    }

    .priorities-footer {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid #D6E4F5;
      color: rgba(10, 22, 40, 0.45);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      padding: 8px 16px;
      cursor: pointer;
      letter-spacing: 0.03em;
    }

    .clear-btn:hover {
      opacity: 0.7;
    }

    @media (max-width: 900px) {
      .topbar {
        padding: 14px 24px;
        flex-wrap: wrap;
      }

      .grid {
        grid-template-columns: 1fr;
        padding: 0 24px;
      }

      .quote-card {
        grid-column: 1;
      }

      .priorities-card {
        grid-column: 1;
      }

      .priorities-inner {
        grid-template-columns: 1fr;
      }

      #time {
        font-size: 52px;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <span class="topbar-label">Quick launch</span>
    <a class="launch-btn" href="https://outlook.office.com" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M2 8l10 6 10-6"/>
      </svg>
      Outlook
    </a>
    <a class="launch-btn" href="https://teams.microsoft.com" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 8h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2v4l-4-4H9a2 2 0 0 1-2-2v-1"/>
        <path d="M15 2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2v4l4-4h4a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
      </svg>
      Teams
    </a>
    <a class="launch-btn" href="https://www.office.com/launch/excel" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M3 15h18M9 3v18"/>
      </svg>
      Excel
    </a>
  </div>

  <!-- Main grid -->
  <div class="grid">

    <!-- Clock -->
    <div class="card clock-card">
      <div class="card-label">Today</div>
      <div id="time">--:--</div>
      <div id="date">Loading...</div>
    </div>

    <!-- Quote -->
    <div class="quote-card">
      <p>Vision without execution is hallucination.</p>
    </div>

    <!-- Priorities -->
    <div class="card priorities-card">
      <div class="card-label">Top 3 priorities</div>
      <div class="priorities-inner">
        <div class="priority-slot">
          <span class="priority-slot-label">Priority 1</span>
          <input class="priority-input" id="p1" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <div class="priority-slot">
          <span class="priority-slot-label">Priority 2</span>
          <input class="priority-input" id="p2" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <div class="priority-slot">
          <span class="priority-slot-label">Priority 3</span>
          <input class="priority-input" id="p3" type="text" autocomplete="off" spellcheck="false" />
        </div>
      </div>
      <div class="priorities-footer">
        <button class="clear-btn" id="clearBtn">Clear day</button>
      </div>
    </div>

  </div>

  <script>
    // ── Clock ──────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const mins = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${mins}`;

      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('date').textContent =
        `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // ── Priorities — localStorage ──────────────────────────
    const fields = ['p1', 'p2', 'p3'];

    fields.forEach(id => {
      const el = document.getElementById(id);
      const saved = localStorage.getItem(id);
      if (saved) el.value = saved;
      el.addEventListener('input', () => localStorage.setItem(id, el.value));
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      fields.forEach(id => {
        document.getElementById(id).value = '';
        localStorage.removeItem(id);
      });
    });
  </script>
</body>
</html>
